<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Podcast</title>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-card: #222222;
      --bg-hover: #2a2a2a;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-muted: #666;
      --border: #333;
      --accent: #8B5CF6;
      --fiction: #8B5CF6;
      --clemson: #F97316;
      --tech: #06B6D4;
      --laliga: #EF4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--fiction), var(--tech));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .icon-btn.spinning svg {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Category Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .tab.active {
      background: var(--text-primary);
      color: var(--bg-primary);
      border-color: var(--text-primary);
    }

    .tab .tab-icon {
      font-size: 14px;
    }

    /* Content Area */
    .content {
      padding: 16px 20px;
    }

    .feed-status {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .feed-status .status-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .feed-status p {
      font-size: 15px;
      line-height: 1.5;
    }

    /* Loading skeleton */
    .skeleton {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .skeleton-line {
      background: var(--bg-hover);
      border-radius: 4px;
      height: 14px;
      margin-bottom: 10px;
    }

    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 70%; }
    .skeleton-line.long { width: 100%; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Article Cards */
    .article-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .article-card:hover {
      background: var(--bg-hover);
      border-color: var(--border);
      transform: translateY(-1px);
    }

    .article-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      border-radius: 3px 0 0 3px;
    }

    .article-card[data-category="fiction"]::before { background: var(--fiction); }
    .article-card[data-category="clemson"]::before { background: var(--clemson); }
    .article-card[data-category="tech"]::before { background: var(--tech); }
    .article-card[data-category="laliga"]::before { background: var(--laliga); }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .category-badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .category-badge.fiction { background: rgba(139, 92, 246, 0.15); color: var(--fiction); }
    .category-badge.clemson { background: rgba(249, 115, 22, 0.15); color: var(--clemson); }
    .category-badge.tech { background: rgba(6, 182, 212, 0.15); color: var(--tech); }
    .category-badge.laliga { background: rgba(239, 68, 68, 0.15); color: var(--laliga); }

    .source-name {
      color: var(--text-muted);
      font-weight: 500;
    }

    .card-time {
      color: var(--text-muted);
      margin-left: auto;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    .card-snippet {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-image {
      width: calc(100% + 40px);
      margin: 12px -20px -20px;
      height: 200px;
      object-fit: cover;
      border-radius: 0 0 16px 16px;
    }

    /* Settings Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 800px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }

    .modal-close {
      background: var(--bg-card);
      border: none;
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .settings-category {
      margin-bottom: 24px;
      background: var(--bg-card);
      border-radius: 14px;
      padding: 16px;
    }

    .settings-category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .settings-category-icon {
      font-size: 20px;
    }

    .settings-category-name {
      font-size: 16px;
      font-weight: 600;
    }

    .settings-category-delete {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .settings-category-delete:hover {
      color: #EF4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .feed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-secondary);
      border-radius: 10px;
      font-size: 14px;
    }

    .feed-item-info {
      flex: 1;
      min-width: 0;
    }

    .feed-item-name {
      font-weight: 500;
      font-size: 13px;
    }

    .feed-item-url {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .feed-item-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .feed-item-remove:hover {
      color: #EF4444;
    }

    .add-feed-row {
      display: flex;
      gap: 8px;
    }

    .add-feed-row input {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      min-width: 0;
    }

    .add-feed-row input:focus {
      border-color: var(--accent);
    }

    .add-feed-row input::placeholder {
      color: var(--text-muted);
    }

    .btn-add {
      background: var(--accent);
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .btn-add:hover {
      opacity: 0.85;
    }

    /* Add Category Section */
    .add-category-section {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      margin-top: 8px;
    }

    .add-category-section h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }

    .add-category-row {
      display: flex;
      gap: 8px;
    }

    .add-category-row input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }

    .add-category-row input:focus {
      border-color: var(--accent);
    }

    .add-category-row input::placeholder {
      color: var(--text-muted);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 30px;
    }

    .empty-state .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .empty-state h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-secondary);
      font-size: 15px;
      max-width: 360px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Date headers */
    .date-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 20px 0 10px;
    }

    .date-header:first-child {
      padding-top: 4px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s;
      z-index: 300;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .header { padding: 12px 16px 0; }
      .content { padding: 12px 16px; }
      .article-card { padding: 16px; }
      .card-title { font-size: 16px; }
      .card-image {
        width: calc(100% + 32px);
        margin: 12px -16px -16px;
      }
      .modal { padding: 20px 16px; }
      .add-feed-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <div class="logo-icon">🎙️</div>
          <span class="logo-text">My Podcast</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="refreshBtn" title="Refresh feeds">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5v4h4"/><path d="M1.84 10a6.5 6.5 0 1 0 .66-4.5L1.5 5.5"/></svg>
          </button>
          <button class="icon-btn" id="settingsBtn" title="Manage feeds">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M13.3 10a1.2 1.2 0 0 0 .24 1.32l.04.04a1.44 1.44 0 1 1-2.04 2.04l-.04-.04a1.2 1.2 0 0 0-1.32-.24 1.2 1.2 0 0 0-.72 1.1v.12a1.44 1.44 0 1 1-2.88 0v-.06A1.2 1.2 0 0 0 5.8 13.3a1.2 1.2 0 0 0-1.32.24l-.04.04a1.44 1.44 0 1 1-2.04-2.04l.04-.04A1.2 1.2 0 0 0 2.68 10a1.2 1.2 0 0 0-1.1-.72H1.44a1.44 1.44 0 0 1 0-2.88h.06A1.2 1.2 0 0 0 2.7 5.8a1.2 1.2 0 0 0-.24-1.32l-.04-.04a1.44 1.44 0 1 1 2.04-2.04l.04.04A1.2 1.2 0 0 0 5.82 2.68h.06V1.44a1.44 1.44 0 1 1 2.88 0v.06a1.2 1.2 0 0 0 .72 1.1 1.2 1.2 0 0 0 1.32-.24l.04-.04a1.44 1.44 0 1 1 2.04 2.04l-.04.04a1.2 1.2 0 0 0-.24 1.32v.06h.12a1.44 1.44 0 0 1 0 2.88h-.06a1.2 1.2 0 0 0-1.1.72z"/></svg>
          </button>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>

    <!-- Content -->
    <div class="content" id="content"></div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title">Manage Feeds</span>
          <button class="modal-close" id="closeSettings">&times;</button>
        </div>
        <div id="settingsBody"></div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script>
    // State
    let categories = [];
    let fullCategories = []; // with feed details
    let currentCategory = 'all';
    let articles = [];
    let isLoading = false;

    // DOM
    const tabsEl = document.getElementById('tabs');
    const contentEl = document.getElementById('content');
    const settingsModal = document.getElementById('settingsModal');
    const settingsBody = document.getElementById('settingsBody');
    const refreshBtn = document.getElementById('refreshBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettings');

    // Init
    async function init() {
      await loadCategories();
      renderTabs();
      await loadFeed();
    }

    // Load categories
    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        categories = await res.json();
      } catch (err) {
        console.error('Failed to load categories:', err);
      }
    }

    // Render tabs
    function renderTabs() {
      const allTab = `<button class="tab ${currentCategory === 'all' ? 'active' : ''}" data-cat="all">
        <span class="tab-icon">🎙️</span> All
      </button>`;

      const catTabs = categories.map(cat =>
        `<button class="tab ${currentCategory === cat.id ? 'active' : ''}" data-cat="${cat.id}">
          <span class="tab-icon">${cat.icon}</span> ${cat.name}
        </button>`
      ).join('');

      tabsEl.innerHTML = allTab + catTabs;

      tabsEl.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          currentCategory = tab.dataset.cat;
          renderTabs();
          loadFeed();
        });
      });
    }

    // Load feed
    async function loadFeed() {
      isLoading = true;
      renderLoading();

      try {
        const url = currentCategory === 'all'
          ? '/api/feed'
          : `/api/feed?category=${encodeURIComponent(currentCategory)}`;
        const res = await fetch(url);
        articles = await res.json();
      } catch (err) {
        console.error('Failed to load feed:', err);
        articles = [];
      }

      isLoading = false;
      renderFeed();
    }

    // Render loading state
    function renderLoading() {
      contentEl.innerHTML = Array(5).fill(0).map(() => `
        <div class="skeleton">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line long"></div>
          <div class="skeleton-line medium"></div>
        </div>
      `).join('');
    }

    // Format relative time
    function timeAgo(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = now - date;
      const mins = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      if (hours < 24) return `${hours}h ago`;
      if (days < 7) return `${days}d ago`;
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // Get date group label
    function getDateGroup(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      const articleDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

      if (articleDate >= today) return 'Today';
      if (articleDate >= yesterday) return 'Yesterday';
      if (now - articleDate < 7 * 86400000) return 'This Week';
      return 'Earlier';
    }

    // Render feed
    function renderFeed() {
      if (articles.length === 0) {
        contentEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎙️</div>
            <h2>No stories yet</h2>
            <p>We're fetching your feeds. If this persists, check your feed sources in settings.</p>
          </div>`;
        return;
      }

      let html = '';
      let lastGroup = '';

      articles.forEach(article => {
        const group = getDateGroup(article.pubDate);
        if (group !== lastGroup) {
          html += `<div class="date-header">${group}</div>`;
          lastGroup = group;
        }

        const cat = categories.find(c => c.id === article.categoryId);
        const catId = escapeAttr(article.categoryId);
        const imageHtml = article.image
          ? `<img class="card-image" src="${escapeAttr(article.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`
          : '';

        html += `
          <div class="article-card" data-category="${catId}" data-link="${escapeAttr(article.link)}">
            <div class="card-meta">
              <span class="category-badge ${catId}">${cat ? cat.icon : ''} ${cat ? escapeHtml(cat.name) : ''}</span>
              <span class="source-name">${escapeHtml(article.source)}</span>
              <span class="card-time">${timeAgo(article.pubDate)}</span>
            </div>
            <div class="card-title">${escapeHtml(article.title)}</div>
            ${article.snippet ? `<div class="card-snippet">${escapeHtml(article.snippet)}</div>` : ''}
            ${imageHtml}
          </div>`;
      });

      contentEl.innerHTML = html;

      // Add click handlers
      contentEl.querySelectorAll('.article-card').forEach(card => {
        card.addEventListener('click', () => {
          const link = card.getAttribute('data-link');
          if (link) window.open(link, '_blank', 'noopener');
        });
      });
    }

    // Escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Escape for HTML attributes
    function escapeAttr(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Refresh feeds
    async function refreshFeeds() {
      refreshBtn.classList.add('spinning');
      showToast('Refreshing feeds...');
      try {
        await fetch('/api/refresh', { method: 'POST' });
        await loadFeed();
        showToast('Feeds refreshed!');
      } catch {
        showToast('Failed to refresh');
      } finally {
        refreshBtn.classList.remove('spinning');
      }
    }

    // Settings
    async function openSettings() {
      // Load full category data with feeds
      try {
        const res = await fetch('/api/categories/full');
        fullCategories = await res.json();
      } catch {
        fullCategories = categories;
      }
      renderSettings();
      settingsModal.classList.add('open');
    }

    function closeSettingsModal() {
      settingsModal.classList.remove('open');
      loadCategories().then(() => {
        renderTabs();
        loadFeed();
      });
    }

    function renderSettings() {
      let html = '';

      fullCategories.forEach(cat => {
        const feeds = cat.feeds || [];
        html += `
          <div class="settings-category">
            <div class="settings-category-header">
              <span class="settings-category-icon">${cat.icon}</span>
              <span class="settings-category-name">${escapeHtml(cat.name)}</span>
              <button class="settings-category-delete" data-delete-cat="${escapeAttr(cat.id)}">Remove</button>
            </div>
            <div class="feed-list">
              ${feeds.map(f => `
                <div class="feed-item">
                  <div class="feed-item-info">
                    <div class="feed-item-name">${escapeHtml(f.name)}</div>
                    <div class="feed-item-url">${escapeHtml(f.url)}</div>
                  </div>
                  <button class="feed-item-remove" data-remove-feed="${escapeAttr(cat.id)}" data-feed-url="${escapeAttr(f.url)}" title="Remove feed">&times;</button>
                </div>
              `).join('')}
              ${feeds.length === 0 ? '<div style="padding:8px 0;color:var(--text-muted);font-size:13px">No feeds yet. Add one below.</div>' : ''}
            </div>
            <div class="add-feed-row">
              <input type="text" placeholder="Feed name" id="newFeedName-${escapeAttr(cat.id)}">
              <input type="text" placeholder="RSS feed URL" id="newFeedUrl-${escapeAttr(cat.id)}">
              <button class="btn-add" data-add-feed="${escapeAttr(cat.id)}">Add</button>
            </div>
          </div>`;
      });

      html += `
        <div class="add-category-section">
          <h3>Add New Category</h3>
          <div class="add-category-row">
            <input type="text" placeholder="Category name" id="newCategoryName">
            <input type="text" placeholder="Emoji icon" id="newCategoryIcon" style="max-width:80px">
            <button class="btn-add" id="addCategoryBtn">Add</button>
          </div>
        </div>`;

      settingsBody.innerHTML = html;

      // Wire up event handlers
      settingsBody.querySelectorAll('[data-delete-cat]').forEach(btn => {
        btn.addEventListener('click', () => deleteCategory(btn.dataset.deleteCat));
      });

      settingsBody.querySelectorAll('[data-remove-feed]').forEach(btn => {
        btn.addEventListener('click', () => removeFeed(btn.dataset.removeFeed, btn.dataset.feedUrl));
      });

      settingsBody.querySelectorAll('[data-add-feed]').forEach(btn => {
        btn.addEventListener('click', () => addFeed(btn.dataset.addFeed));
      });

      const addCatBtn = document.getElementById('addCategoryBtn');
      if (addCatBtn) addCatBtn.addEventListener('click', addCategory);
    }

    async function addFeed(categoryId) {
      const nameInput = document.getElementById(`newFeedName-${categoryId}`);
      const urlInput = document.getElementById(`newFeedUrl-${categoryId}`);
      const name = nameInput.value.trim();
      const url = urlInput.value.trim();

      if (!name || !url) {
        showToast('Please enter both name and URL');
        return;
      }

      try {
        const res = await fetch(`/api/categories/${encodeURIComponent(categoryId)}/feeds`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, url })
        });

        if (res.ok) {
          nameInput.value = '';
          urlInput.value = '';
          showToast('Feed added!');
          // Reload settings
          const fullRes = await fetch('/api/categories/full');
          fullCategories = await fullRes.json();
          renderSettings();
        } else {
          const err = await res.json();
          showToast(err.error || 'Failed to add feed');
        }
      } catch {
        showToast('Failed to add feed');
      }
    }

    async function removeFeed(categoryId, feedUrl) {
      try {
        const res = await fetch(`/api/categories/${encodeURIComponent(categoryId)}/feeds`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: feedUrl })
        });

        if (res.ok) {
          showToast('Feed removed');
          const fullRes = await fetch('/api/categories/full');
          fullCategories = await fullRes.json();
          renderSettings();
        }
      } catch {
        showToast('Failed to remove feed');
      }
    }

    async function addCategory() {
      const nameInput = document.getElementById('newCategoryName');
      const iconInput = document.getElementById('newCategoryIcon');
      const name = nameInput.value.trim();
      const icon = iconInput.value.trim() || '📌';

      if (!name) {
        showToast('Please enter a category name');
        return;
      }

      try {
        const res = await fetch('/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, icon })
        });

        if (res.ok) {
          nameInput.value = '';
          iconInput.value = '';
          showToast('Category added!');
          await loadCategories();
          const fullRes = await fetch('/api/categories/full');
          fullCategories = await fullRes.json();
          renderSettings();
        } else {
          const err = await res.json();
          showToast(err.error || 'Failed to add category');
        }
      } catch {
        showToast('Failed to add category');
      }
    }

    async function deleteCategory(categoryId) {
      if (!confirm('Remove this category and all its feeds?')) return;

      try {
        await fetch(`/api/categories/${encodeURIComponent(categoryId)}`, { method: 'DELETE' });
        showToast('Category removed');
        await loadCategories();
        const fullRes = await fetch('/api/categories/full');
        fullCategories = await fullRes.json();
        renderSettings();
      } catch {
        showToast('Failed to remove category');
      }
    }

    // Toast
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Event listeners
    refreshBtn.addEventListener('click', refreshFeeds);
    settingsBtn.addEventListener('click', openSettings);
    closeSettingsBtn.addEventListener('click', closeSettingsModal);
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) closeSettingsModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSettingsModal();
    });

    // Start
    init();
  </script>
</body>
</html>
